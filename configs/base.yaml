# Settings shared by all FocusFormer models.
MODEL:
  META_ARCHITECTURE: "VideoFocusFormer"
  MASK_ON: True
  FUSE_STRATEGY: "gaussian"
  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 1
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "ZFiLMEnhanceMSDeformAttnPixelDecoder"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
  MASK_FORMER:
    # FocusFormer modules
    USE_FOCUS_SAMPLER: True   # SQI
    USE_DFE: True             # DFE
    DFE_VARIANT: "full"
    USE_GAUSSIAN_FOCUS: True  # GWA
    TRANSFORMER_DECODER_NAME: "FocusMultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 10  # 9 decoder layers, add one for the loss on learnable query
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    TEST:
      SEMANTIC_ON: False
      INSTANCE_ON: True
      PANOPTIC_ON: False
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.8
  ROI_HEADS:
    SCORE_THRESH_TEST: 0.05
DATASETS:
  TRAIN: ("focal_stack_train",)
  TEST: ()
SOLVER:
  IMS_PER_BATCH: 4
  OPTIMIZER: "ADAMW"
  BASE_LR: 0.0003
  BASE_LR_END: 0.000001
  BACKBONE_MULTIPLIER: 0.1
  WEIGHT_DECAY: 0.05
  LR_SCHEDULER_NAME: "WarmupCosineLR"
  WARMUP_FACTOR: 0.001
  WARMUP_ITERS: 4000
  MAX_ITER: 20000
  CHECKPOINT_PERIOD: 2000
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True
INPUT:
  # The full ordered focal stack is used (11 planes for Embryo, 21 for CISD).
  USE_FULL_FOCAL_STACK: True
  SAMPLING_STRATEGY: "full"
  SAMPLING_FRAME_RANGE: 5
  SAMPLING_FRAME_SHUFFLE: False
  AUGMENTATIONS: []
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TRAIN: (512,)
  MAX_SIZE_TRAIN: 512
  MIN_SIZE_TEST: 512
  MAX_SIZE_TEST: 512
  RANDOM_FLIP: "horizontal"
  CROP:
    ENABLED: False
    TYPE: "absolute_range"
    SIZE: (600, 720)
  FORMAT: "RGB"
TEST:
  EVAL_PERIOD: 0
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
  NUM_WORKERS: 4
SEED: 42
VIS_PERIOD: 100000
VERSION: 2
